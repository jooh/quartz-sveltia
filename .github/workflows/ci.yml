name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Declaration exports
        run: npm run check:declarations
      - name: Bundled runtime dependencies
        run: npm run check:externals
      - name: Committed dist is current
        run: git diff --exit-code -- dist
      - name: Credential scan
        run: npm run scan:secrets
