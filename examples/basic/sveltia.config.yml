backend:
  name: github
  repo: __GITHUB_REPOSITORY__
  auth_methods: [token]

media_folder: content/media
public_folder: /media

collections:
  - name: pages
    label: Pages
    folder: content
    create: true
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string }
      - {
          name: description,
          label: Description,
          widget: string,
          required: false,
        }
      - { name: body, label: Body, widget: markdown }
